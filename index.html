<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riordino Etichette</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.95rem; }
    .card { border-radius: 12px; border: none; box-shadow: 0 3px 10px rgba(0,0,0,0.04); margin-bottom: 1rem; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; display: none; }
    .table-input { width: 65px; text-align: center; padding: 0.25rem; }
    .section-fronte { background-color: #f1f5f9; border-left: 4px solid #0d6efd; padding: 10px; border-radius: 6px; }
    .section-retro { background-color: #f1f5f9; border-left: 4px solid #198754; padding: 10px; border-radius: 6px; }
    .btn-sm-mobile { padding: 0.35rem 0.6rem; font-size: 0.85rem; }
    table td, table th { vertical-align: middle; padding: 0.5rem !important; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary mb-3 shadow-sm py-2">
    <div class="container-fluid px-3">
      <span class="navbar-brand mb-0 hari fs-6 fw-bold"><i class="fa-solid fa-tags me-2"></i>Riordino Etichette</span>
      <button class="btn btn-outline-light btn-sm btn-sm-mobile" onclick="caricaDaCloud()"><i class="fa-solid fa-rotate me-1"></i>Sync</button>
    </div>
  </nav>

  <div class="container px-2 px-md-3 pb-5">
    
    <!-- Tab Nav -->
    <ul class="nav nav-pills mb-3 nav-justified bg-white p-1 rounded shadow-sm" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active fw-bold py-2" id="order-tab" data-bs-toggle="pill" data-bs-target="#order" type="button"><i class="fa-solid fa-cart-shopping me-1"></i>Ordina</button>
      </li>
      <li class="nav-item">
        <button class="nav-link fw-bold py-2" id="master-tab" data-bs-toggle="pill" data-bs-target="#master" type="button"><i class="fa-solid fa-database me-1"></i>Anagrafica</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      
      <!-- TAB 1: RIORDINO ETICHETTE -->
      <div class="tab-pane fade show active" id="order" role="tabpanel">
        
        <!-- Area Scanner & Input -->
        <div class="card p-3">
          <h6 class="card-title text-secondary fw-bold mb-2"><i class="fa-solid fa-barcode me-1"></i>Scansione / Ricerca</h6>
          
          <div id="reader" class="mb-2"></div>

          <div class="input-group">
            <button class="btn btn-outline-primary btn-sm-mobile" type="button" id="btnScan" onclick="toggleScanner()"><i class="fa-solid fa-camera"></i></button>
            <input type="text" id="scanInput" class="form-control" placeholder="Codice articolo..." onkeypress="if(event.key==='Enter') gestisciScansioneInput()">
            <button class="btn btn-primary btn-sm-mobile" type="button" onclick="gestisciScansioneInput()"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>

        <!-- TABELLA ORDINE CORRENTE -->
        <div class="card p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="card-title text-secondary fw-bold mb-0"><i class="fa-solid fa-list-check me-1"></i>Lista Riordino</h6>
            <button class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size: 0.8rem;" onclick="svuotaOrdine()"><i class="fa-solid fa-trash me-1"></i>Svuota</button>
          </div>
          
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light" style="font-size: 0.85rem;">
                <tr>
                  <th>Articolo</th>
                  <th class="text-center">Fronte</th>
                  <th class="text-center">Retro</th>
                  <th class="text-end">Az.</th>
                </tr>
              </thead>
              <tbody id="tbOrdine" style="font-size: 0.85rem;">
                <tr><td colspan="4" class="text-center text-muted py-3">Nessun articolo in lista.</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Pulsanti Invia Email / Copia -->
          <div class="d-grid gap-2 d-flex mt-2">
            <button class="btn btn-outline-secondary btn-sm flex-fill" onclick="copiaNegliAppunti()"><i class="fa-solid fa-copy me-1"></i>Copia</button>
            <button class="btn btn-success btn-sm flex-fill" onclick="inviaEmail()"><i class="fa-solid fa-paper-plane me-1"></i>Invia Email</button>
          </div>
        </div>

      </div>

      <!-- TAB 2: ANAGRAFICA MASTER -->
      <div class="tab-pane fade" id="master" role="tabpanel">
        
        <!-- Form Nuovo/Modifica Articolo -->
        <div class="card p-3">
          <h6 class="card-title text-secondary fw-bold mb-2" id="formTitle"><i class="fa-solid fa-square-plus me-1"></i>Nuovo / Modifica Articolo</h6>
          <form id="formAnagrafica" onsubmit="salvaInAnagrafica(event)">
            <div class="row g-2">
              <div class="col-6">
                <input type="text" id="mCodice" class="form-control form-control-sm" placeholder="Codice Art." required>
              </div>
              <div class="col-6">
                <input type="text" id="mDesc" class="form-control form-control-sm" placeholder="Descrizione" required>
              </div>
              <div class="col-6">
                <input type="text" id="mCodFronte" class="form-control form-control-sm" placeholder="Eti. Fronte (o nessuna)">
              </div>
              <div class="col-6">
                <input type="text" id="mCodRetro" class="form-control form-control-sm" placeholder="Eti. Retro (o nessuna)">
              </div>
            </div>
            <div class="mt-2 d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm flex-fill"><i class="fa-solid fa-cloud-arrow-up me-1"></i>Salva</button>
              <button type="button" id="btnAnnullaModifica" class="btn btn-secondary btn-sm d-none" onclick="resetFormAnagrafica()">Annulla</button>
            </div>
          </form>
        </div>

        <!-- Tabella Master con Filtro -->
        <div class="card p-3">
          <div class="d-flex justify-content-between align-items-center mb-2 gap-1">
            <h6 class="card-title text-secondary fw-bold mb-0">Anagrafica</h6>
            <div class="input-group input-group-sm" style="width: 170px;">
              <span class="input-group-text bg-white"><i class="fa-solid fa-search"></i></span>
              <input type="text" id="filtroAnagrafica" class="form-control" placeholder="Cerca..." oninput="renderAnagrafica()">
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped">
              <thead class="table-light" style="font-size: 0.85rem;">
                <tr>
                  <th>Codice / Desc</th>
                  <th>Fronte</th>
                  <th>Retro</th>
                  <th class="text-end">Azioni</th>
                </tr>
              </thead>
              <tbody id="tbAnagrafica" style="font-size: 0.85rem;">
                <tr><td colspan="4" class="text-center text-muted py-3">Caricamento...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- MODALE DI CONFERMA INSERIMENTO QUANTITÀ & CODICI -->
  <div class="modal fade" id="modalInserimento" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white py-2">
          <h6 class="modal-title fs-6"><i class="fa-solid fa-cart-plus me-1"></i>Quantità Etichette</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-2">
          <input type="hidden" id="modalCodiceArticolo">
          <input type="hidden" id="modalDescArticolo">

          <p class="mb-2 small">Articolo: <strong id="modalInfoArticolo"></strong></p>
          
          <!-- SEZIONE FRONTE -->
          <div class="section-fronte mb-2" id="wrapperFronte">
            <label class="form-label fw-bold text-primary mb-1 small"><i class="fa-solid fa-arrow-up-from-bracket me-1"></i>Etichetta Fronte</label>
            <div class="input-group input-group-sm mb-1">
              <span class="input-group-text bg-white text-muted" style="font-size: 0.8rem;">Cod.</span>
              <input type="text" id="modalCodFronte" class="form-control bg-light" readonly>
            </div>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white" style="font-size: 0.8rem;">Q.tà</span>
              <input type="number" id="modalQtaFronte" class="form-control" value="" placeholder="" min="0">
            </div>
          </div>

          <!-- SEZIONE RETRO -->
          <div class="section-retro mb-1" id="wrapperRetro">
            <label class="form-label fw-bold text-success mb-1 small"><i class="fa-solid fa-arrow-rotate-left me-1"></i>Etichetta Retro</label>
            <div class="input-group input-group-sm mb-1">
              <span class="input-group-text bg-white text-muted" style="font-size: 0.8rem;">Cod.</span>
              <input type="text" id="modalCodRetro" class="form-control bg-light" readonly>
            </div>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white" style="font-size: 0.8rem;">Q.tà</span>
              <input type="number" id="modalQtaRetro" class="form-control" value="" placeholder="" min="0">
            </div>
          </div>
        </div>
        <div class="modal-footer py-2">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annulla</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="confermaAggiuntaOrdine()">Conferma</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-6lY9cP3GCGlG1dEXfA9bDEMVt1-C78ou-vkGQf3vukTqriNks8sBpp5oCaulxpct/exec";

    let anagrafica = [];
    let ordineCorrente = [];
    let html5QrcodeScanner = null;
    let modalInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
      modalInstance = new bootstrap.Modal(document.getElementById('modalInserimento'));
      caricaDaCloud();
    });

    async function caricaDaCloud() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          anagrafica = data.map(item => ({
            codice: String(item.Codice !== undefined ? item.Codice : (item.codice || "")),
            descrizione: String(item.Descrizione !== undefined ? item.Descrizione : (item.descrizione || "")),
            codFronte: String(item.CodFronte !== undefined ? item.CodFronte : (item.codFronte || "nessuna")),
            codRetro: String(item.CodRetro !== undefined ? item.CodRetro : (item.codRetro || "nessuna"))
          })).filter(a => a.codice !== "");
          renderAnagrafica();
        }
      } catch (err) {
        console.warn("Impossibile sincronizzare dal cloud:", err);
      }
    }

    async function sincronizzaCloud() {
      try {
        const dataString = encodeURIComponent(JSON.stringify(anagrafica));
        await fetch(`${GOOGLE_SCRIPT_URL}?action=save&data=${dataString}`);
      } catch (err) {
        console.error("Errore salvataggio cloud:", err);
      }
    }

    function isNessuna(valore) {
      if (!valore) return true;
      const v = String(valore).trim().toLowerCase();
      return v === "" || v === "nessuna" || v === "-" || v === "nessuno";
    }

    // === GESTIONE INSERIMENTO NELL'ORDINE ===
    function gestisciScansioneInput() {
      const input = document.getElementById("scanInput");
      const codice = input.value.trim();
      if (!codice) return;
      input.value = "";
      apriModaleInserimento(codice);
    }

    function apriModaleInserimento(codice) {
      let trovato = anagrafica.find(a => a.codice.toLowerCase() === codice.toLowerCase());

      // SE L'ARTICOLO NON ESISTE IN ANAGRAFICA, BLOCCA E AVVISA
      if (!trovato) {
        alert(`Errore: L'articolo "${codice}" non esiste in anagrafica. Inseriscilo prima nella sezione Anagrafica Cloud.`);
        return;
      }

      document.getElementById("modalCodiceArticolo").value = trovato.codice;
      document.getElementById("modalDescArticolo").value = trovato.descrizione;
      document.getElementById("modalInfoArticolo").innerText = `${trovato.codice} - ${trovato.descrizione}`;

      const wrapFronte = document.getElementById("wrapperFronte");
      const wrapRetro = document.getElementById("wrapperRetro");

      if (isNessuna(trovato.codFronte)) {
        wrapFronte.style.display = "none";
        document.getElementById("modalCodFronte").value = "nessuna";
        document.getElementById("modalQtaFronte").value = "";
      } else {
        wrapFronte.style.display = "block";
        document.getElementById("modalCodFronte").value = trovato.codFronte;
        document.getElementById("modalQtaFronte").value = "";
      }

      if (isNessuna(trovato.codRetro)) {
        wrapRetro.style.display = "none";
        document.getElementById("modalCodRetro").value = "nessuna";
        document.getElementById("modalQtaRetro").value = "";
      } else {
        wrapRetro.style.display = "block";
        document.getElementById("modalCodRetro").value = trovato.codRetro;
        document.getElementById("modalQtaRetro").value = "";
      }

      modalInstance.show();
    }

    function confermaAggiuntaOrdine() {
      const codice = document.getElementById("modalCodiceArticolo").value;
      const descrizione = document.getElementById("modalDescArticolo").value;
      
      const codFronte = document.getElementById("modalCodFronte").value.trim();
      const qtaFronte = isNessuna(codFronte) ? 0 : (parseInt(document.getElementById("modalQtaFronte").value) || 0);

      const codRetro = document.getElementById("modalCodRetro").value.trim();
      const qtaRetro = isNessuna(codRetro) ? 0 : (parseInt(document.getElementById("modalQtaRetro").value) || 0);

      let esistente = ordineCorrente.find(o => o.codice.toLowerCase() === codice.toLowerCase());
      if (esistente) {
        esistente.qtaFronte += qtaFronte;
        esistente.qtaRetro += qtaRetro;
      } else {
        ordineCorrente.push({ codice, descrizione, codFronte, qtaFronte, codRetro, qtaRetro });
      }

      modalInstance.hide();
      renderOrdine();
    }

    function aggiornaQuantitaOrdine(index, campo, valore) {
      ordineCorrente[index][campo] = Math.max(0, parseInt(valore) || 0);
    }

    function eliminaDaOrdine(index) {
      ordineCorrente.splice(index, 1);
      renderOrdine();
    }

    function svuotaOrdine() {
      if (confirm("Vuoi svuotare la lista?")) {
        ordineCorrente = [];
        renderOrdine();
      }
    }

    function renderOrdine() {
      const tbody = document.getElementById("tbOrdine");
      tbody.innerHTML = "";

      if (ordineCorrente.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Nessun articolo in lista.</td></tr>`;
        return;
      }

      ordineCorrente.forEach((item, i) => {
        let htmlFronte = isNessuna(item.codFronte) ? '<span class="text-muted small">-</span>' : `
          <span class="badge bg-primary mb-1" style="font-size: 0.75rem;">${item.codFronte}</span><br>
          <input type="number" class="form-control form-control-sm table-input d-inline" value="${item.qtaFronte}" onchange="aggiornaQuantitaOrdine(${i}, 'qtaFronte', this.value)">
        `;

        let htmlRetro = isNessuna(item.codRetro) ? '<span class="text-muted small">-</span>' : `
          <span class="badge bg-success mb-1" style="font-size: 0.75rem;">${item.codRetro}</span><br>
          <input type="number" class="form-control form-control-sm table-input d-inline" value="${item.qtaRetro}" onchange="aggiornaQuantitaOrdine(${i}, 'qtaRetro', this.value)">
        `;

        tbody.innerHTML += `
          <tr>
            <td><strong>${item.codice}</strong><br><span class="text-muted small text-truncate d-inline-block" style="max-width: 110px;">${item.descrizione}</span></td>
            <td class="text-center">${htmlFronte}</td>
            <td class="text-center">${htmlRetro}</td>
            <td class="text-end">
              <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="eliminaDaOrdine(${i})"><i class="fa-solid fa-times"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // === GESTIONE SCANNER FOTOCAMERA ===
    function toggleScanner() {
      const readerElem = document.getElementById("reader");
      if (readerElem.style.display === "block") {
        stopScanner();
      } else {
        readerElem.style.display = "block";
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 120 } },
          (decodedText) => {
            stopScanner();
            apriModaleInserimento(decodedText);
          },
          (errorMessage) => {}
        ).catch(err => {
          alert("Impossibile attivare la fotocamera (richiesto HTTPS).");
          stopScanner();
        });
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById("reader").style.display = "none";
        }).catch(() => {
          document.getElementById("reader").style.display = "none";
        });
      } else {
        document.getElementById("reader").style.display = "none";
      }
    }

    // === ANAGRAFICA MASTER ===
    function salvaInAnagrafica(e) {
      e.preventDefault();
      const cod = document.getElementById("mCodice").value.trim();
      const desc = document.getElementById("mDesc").value.trim();
      const codFronte = document.getElementById("mCodFronte").value.trim() || "nessuna";
      const codRetro = document.getElementById("mCodRetro").value.trim() || "nessuna";

      let idx = anagrafica.findIndex(a => a.codice.toLowerCase() === cod.toLowerCase());
      if (idx >= 0) {
        anagrafica[idx] = { codice: cod, descrizione: desc, codFronte: codFronte, codRetro: codRetro };
      } else {
        anagrafica.push({ codice: cod, descrizione: desc, codFronte: codFronte, codRetro: codRetro });
      }

      renderAnagrafica();
      sincronizzaCloud();
      resetFormAnagrafica();
      alert("Salvato e sincronizzato!");
    }

    function preparaModificaAnagrafica(codice) {
      const pwd = prompt("Inserisci la password di sicurezza (2026):");
      if (pwd !== "2026") {
        alert("Password errata!");
        return;
      }

      let articolo = anagrafica.find(a => a.codice === codice);
      if (!articolo) return;

      document.getElementById("mCodice").value = articolo.codice;
      document.getElementById("mCodice").readOnly = true;
      document.getElementById("mDesc").value = articolo.descrizione;
      document.getElementById("mCodFronte").value = articolo.codFronte;
      document.getElementById("mCodRetro").value = articolo.codRetro;

      document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-pen-to-square me-1"></i>Modifica: ${articolo.codice}`;
      document.getElementById("btnAnnullaModifica").classList.remove("d-none");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetFormAnagrafica() {
      document.getElementById("formAnagrafica").reset();
      document.getElementById("mCodice").readOnly = false;
      document.getElementById("formTitle").innerHTML = `<i class="fa-solid fa-square-plus me-1"></i>Nuovo / Modifica Articolo`;
      document.getElementById("btnAnnullaModifica").classList.add("d-none");
    }

    function eliminaDaAnagrafica(codice) {
      const pwd = prompt("Inserisci la password di sicurezza (2026):");
      if (pwd !== "2026") {
        alert("Password errata!");
        return;
      }
      anagrafica = anagrafica.filter(a => a.codice !== codice);
      renderAnagrafica();
      sincronizzaCloud();
    }

    function renderAnagrafica() {
      const tbody = document.getElementById("tbAnagrafica");
      const filtro = document.getElementById("filtroAnagrafica").value.toLowerCase();
      tbody.innerHTML = "";

      let anagraficaFiltrata = anagrafica.filter(a => 
        a.codice.toLowerCase().includes(filtro) || 
        a.descrizione.toLowerCase().includes(filtro) ||
        a.codFronte.toLowerCase().includes(filtro) ||
        a.codRetro.toLowerCase().includes(filtro)
      );

      if (anagraficaFiltrata.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Nessun articolo trovato.</td></tr>`;
        return;
      }

      anagraficaFiltrata.forEach(a => {
        let badgeFronte = isNessuna(a.codFronte) ? '<span class="text-muted">-</span>' : `<span class="badge bg-primary" style="font-size:0.75rem;">${a.codFronte}</span>`;
        let badgeRetro = isNessuna(a.codRetro) ? '<span class="text-muted">-</span>' : `<span class="badge bg-success" style="font-size:0.75rem;">${a.codRetro}</span>`;

        tbody.innerHTML += `
          <tr>
            <td><strong>${a.codice}</strong><br><span class="text-muted small">${a.descrizione}</span></td>
            <td>${badgeFronte}</td>
            <td>${badgeRetro}</td>
            <td class="text-end">
              <button class="btn btn-outline-primary btn-sm py-0 px-2 me-1" onclick="preparaModificaAnagrafica('${a.codice}')"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-outline-danger btn-sm py-0 px-2" onclick="eliminaDaAnagrafica('${a.codice}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // === ESPORTAZIONE & EMAIL FORMATTATA A TABELLA ===
    function generaTestoOrdine() {
      let dataOggi = new Date().toLocaleDateString();
      let oraOggi = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      
      let testo = `========================================\n`;
      testo += `       RICHIESTA RIORDINO ETICHETTE     \n`;
      testo += ` Data: ${dataOggi} - Ora: ${oraOggi} \n`;
      testo += `========================================\n\n`;

      ordineCorrente.forEach((o, index) => {
        testo += `[${index + 1}] ARTICOLO: ${o.codice}\n`;
        testo += `    Descrizione : ${o.descrizione}\n`;
        
        if (!isNessuna(o.codFronte) && o.qtaFronte > 0) {
          testo += `    - Fronte    : Cod. [${o.codFronte}]  ->  Q.tà: ${o.qtaFronte} pz\n`;
        }
        if (!isNessuna(o.codRetro) && o.qtaRetro > 0) {
          testo += `    - Retro     : Cod. [${o.codRetro}]  ->  Q.tà: ${o.qtaRetro} pz\n`;
        }
        testo += `----------------------------------------\n`;
      });

      return testo;
    }

    function inviaEmail() {
      if (ordineCorrente.length === 0) return alert("La lista di riordino è vuota!");
      const destinatario = "magazzino@magazzino.it";
      const oraInvio = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const oggetto = encodeURIComponent(`Riordino Etichette - ${new Date().toLocaleDateString()} ore ${oraInvio}`);
      const corpo = encodeURIComponent(generaTestoOrdine());
      window.location.href = `mailto:${destinatario}?subject=${oggetto}&body=${corpo}`;
    }

    function copiaNegliAppunti() {
      if (ordineCorrente.length === 0) return alert("La lista di riordino è vuota!");
      navigator.clipboard.writeText(generaTestoOrdine()).then(() => {
        alert("Lista copiata negli appunti!");
      });
    }
  </script>
</body>
</html>
